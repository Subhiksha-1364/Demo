<template>

    <Lightning-card title='Parent'>


        <lightning-button label='Show child' variant='brand' onclick={handleParentClick}> </lightning-button>

        <h1> MY FAVOURITE SPLAYERS </h1>

        <template for:each={name} for:item="player">
            <h1 key={player}>{player}</h1>
        </template>

        <template lwc:if={showChild}>

            <section role='dialog' tabindex="-1" class='slds-modal slds-fade-in-open'>

                <div class='slds-modal__container'>

                    <header class='slds-modal__header'>
                        <h2 class="slds-text-heading_medium">Players</h2>
                    </header>

                    <div class='slds-modal__content slds-p-around_medium'>

                        <c-child-click onclose={handleChildClick}> </c-child-click>
                    </div>
                </div>

            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </Lightning-card>

</template>
