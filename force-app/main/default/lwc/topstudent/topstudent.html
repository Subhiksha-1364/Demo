<template>

    <lightning-card  title = 'Players'>
        <div class='slds-p-around_medium'>

        <lightning-input type='text' label='Name' placeholder='Enter name' value={name} onchange={handleName}></lightning-input> 
        <lightning-input type='number' label='Score' placeholder='Enter Score' value={score} onchange={handleScore}></lightning-input> 
        <lightning-input type='text' label="Team" placeholder='Enter Team' value={team} onchange={handleTeam}></lightning-input>

        </div>
         <div class='slds-p-around_medium'>

       <lightning-input type='checkbox' label="Add Student ?" onchange={addMem}></lightning-input>
       
         </div>
         <div class='slds-p-around_medium'>
             <lightning-button label='Top Score' onclick={handleView}></lightning-button>

        </div>

        <c-display-score top-score={topPlayerArray}></c-display-score>





    </lightning-card>

</template>
