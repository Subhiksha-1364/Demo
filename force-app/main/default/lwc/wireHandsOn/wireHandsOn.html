<template>

    <lightning-card title="Wire Hands On">

        <template lwc:if={contactDetailProperty.data}>

            <div>
                Last Name: {contactDetailProperty.data.fields.LastName.value}<br>
                Email : {contactEmail}<br>
                Age: {contactDetailProperty.data.fields.Age__c.value}<br>
            </div>

            <div class='slds-p-around_medium'>
                <lightning-button label="Check Eligibility" onclick={checkEligibility} variant="inline"></lightning-button>
            </div>
        </template>
    </lightning-card>

</template>
