<template>

    <lightning-card title="Logging Options">
        <div class="slds-m-around_medium">
            <p>Logging Box</p>
            <div class="slds-m-around_medium">
                <lightning-input type="checkbox" label="Members login" class="ExistCheck"
                    onchange={handleMemberChange}></lightning-input>
            </div>

            <div class="slds-m-around_medium">
                <lightning-input type="checkbox" label="New Members" class="NewCheck"
                    onchange={handleNewChange}></lightning-input>
            </div>

        </div>

        <template lwc:if={showMembers}>
            <lightning-card title="Login Credentials">

            <div class="slds-m-around_medium">
                <lightning-input type="text" label="Enter Username" onchange={handleUsername}></lightning-input>


            </div>

            <div class="slds-m-around_medium">
                <lightning-input type="password" label="Enter Password" onchange={handlePass}></lightning-input>

            </div>

            <div class="slds-m-around_medium">

                <lightning-button label="Login" onclick={LogCheck}></lightning-button>
            </div>

            <template lwc:if={Login}>
                <div class="slds-m-around_medium">
                    <p>{Msg}</p>
                </div>
            </template>
            </lightning-card>



        </template>

        <template lwc:elseif={showNew}>

            <lightning-card title ='Sign In'>
                
                <div class="slds-m-around_medium">

                    <lightning-input type="text" label="Enter Name" onchange={handleName}></lightning-input>
                </div>

                <div class="slds-m-around_medium">

                    <lightning-input type="email" label="Enter Email" onchange={handleEmail}></lightning-input>
                </div>

                <div class="slds-m-around_medium">

                    <lightning-button label="Register" onclick={RegCheck}></lightning-button>
                </div>

                 <template lwc:if={Login}>
                <div class="slds-m-around_medium">
                    <p>{Msg}</p>
                </div>
            </template>
                
            </lightning-card>

            
        </template>

        <template lwc:else>

            <div class="slds-m-around_medium">

                <p>Choose any one to make register</p>
            </div>
        </template>
    
    </lightning-card>



</template>
