<template>

    <lightning-card title=" CSS">

    <div class="slds-p-around_medium">

    </div>

    <div class="slds-p-around_medium">
    <lightning-button label="Give description" onclick={handleClick}></lightning-button>

    </div>

    <div class={style}>

        Description: {description}

    </div>
</lightning-card>

    
</template>
