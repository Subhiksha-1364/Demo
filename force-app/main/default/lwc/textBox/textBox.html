<template>

    <lightning-card title="Palindrome Checker">

    <div class="slds-p-around_medium">
        <lightning-input type="text" label="Enter word" placeholder='Enter Word' value={word} onchange={handleChange}></lightning-input>
    </div>
    

    <div class="slds-p-around_medium">
         <lightning-button label="Check Palindrome" onclick={handleClick}></lightning-button>
    </div>

    
    <div class={chosenStyle}>
        {text}
    </div>

    </lightning-card>

   

    

</template>
